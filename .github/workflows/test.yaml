name: Test

on:
  workflow_dispatch:
  push:

jobs:
  test:
    runs-on: ["ubuntu-latest"]
    steps:

    - uses: actions/checkout@v7

    - uses: 'actions-go/build@47eba5258a8c192e4943b89337d5f5af89954d31' # main on 2026-10-23, ahead of v1.0.1
      id: build-action
      with:
        action_path: ./cmd/action
        action: ${{ github.action }}

    - name: Run CI script
      run: '${{ steps.build-action.outputs.install-path }}'
